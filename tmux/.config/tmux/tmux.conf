# Use C-a, since it's on the home row and easier to hit than C-b
set-option -g prefix M-a
unbind-key C-b
bind-key M-a send-prefix

set -g base-index 1
set -g history-limit 50000
set -g renumber-windows on
setw -g mode-keys vi
set -a terminal-features "xterm-256color:RGB"
set -g extended-keys
set -g allow-passthrough on
set -g focus-events on
# set -g status-position top
# set -g status-style "bg=default"

# Keybindings
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind -r M-h resize-pane -L 1
bind -r M-j resize-pane -D 1
bind -r M-k resize-pane -U 1
bind -r M-l resize-pane -R 1
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key T display-popup -w 80% -h 80% -E
bind e send "echo hello" C-m
bind-key P display-popup -E "ls ~/.config/tmuxinator | sed 's/\.yml$//' | fzf --reverse --prompt='tmuxinator> ' | xargs -r tmuxinator start"

# Session chooser skips "-ai" companions and anything marked with @hidden.
# Name match is stateless, so it also covers "-ai" sessions made outside the script.
bind-key s choose-tree -Zs -O name -f '#{&&:#{!=:#{@hidden},1},#{?#{m:*-ai,#{session_name}},0,1}}'
# ... and <prefix>-S shows everything, hidden ones included. Sorting by name keeps
# the "~"-prefixed companions at the bottom ("~" sorts after letters in ASCII).
bind-key S choose-tree -Zs -O name

# Toggle between this session and its "<name>-ai" companion, creating it on demand
bind-key a run-shell "~/.config/scripts/tmux-ai-session.sh"

# Reload tmux config with <prefix>-r.
bind-key r source-file ~/.config/tmux/tmux.conf \; display '~/.config/tmux/tmux.conf sourced'

# Theme (rewritten in place by ~/.config/scripts/switch-theme.sh)
source-file ~/.config/tmux/themes/gruvbox-light.conf

# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'schasse/tmux-jump'
set -g @jump-key 'J'
run '~/.tmux/plugins/tpm/tpm'
