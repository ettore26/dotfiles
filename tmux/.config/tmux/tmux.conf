# Use C-a, since it's on the home row and easier to hit than C-b
set-option -g prefix M-a
unbind-key C-b
bind-key M-a send-prefix

set -g base-index 1
set -g history-limit 50000
set -g renumber-windows on
setw -g mode-keys vi
set -a terminal-features "xterm-256color:RGB"
set -a terminal-features "xterm-256color:strikethrough"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -g focus-events on
# set -g status-position top
# set -g status-style "bg=default"

# Keybindings
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# smart-splits.nvim (backend-tmux): C-hjkl moves and M-hjkl resizes across nvim splits and
# tmux panes. Panes running nvim get the keys while @pane-is-vim is set; at nvim's last
# split the plugin hands over to tmux. select-pane wraps at the window edge.
# Claude Code panes (@pane-is-claude, set by its SessionStart hook) move the same way through the
# x-agents-flow panel above the prompt (@claude-panel, set by the mod: open, or focused while it
# holds the keys): C-k from the prompt into the open panel, C-j from the panel back to the prompt,
# sent as M-k and M-j, which Claude's keybindings bind (its prompt types a bare C-j as a new line).
bind -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { select-pane -L }
bind -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { if -F '#{&&:#{@pane-is-claude},#{==:#{@claude-panel},focused}}' { send-keys M-j } { select-pane -D } }
bind -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { if -F '#{&&:#{@pane-is-claude},#{==:#{@claude-panel},open}}' { send-keys M-k } { select-pane -U } }
bind -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { select-pane -R }
bind -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { resize-pane -L 3 }
bind -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { resize-pane -D 3 }
bind -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { resize-pane -U 3 }
bind -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { resize-pane -R 3 }
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# The shell's own C-l (clear screen) and C-k (kill line) behind the prefix
bind C-l send-keys C-l
bind C-k send-keys C-k
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key T display-popup -w 80% -h 80% -E
bind e send "echo hello" C-m

# Session chooser skips "-ai" companions and anything marked with @hidden.
# Name match is stateless, so it also covers "-ai" sessions made outside the script.
bind-key s choose-tree -Zs -O name -f '#{&&:#{!=:#{@hidden},1},#{?#{m:*-ai,#{session_name}},0,1}}'
# ... and <prefix>-S shows everything, hidden ones included. Sorting by name keeps
# the "~"-prefixed companions at the bottom ("~" sorts after letters in ASCII).
bind-key S choose-tree -Zs -O name
# <prefix>-P picks a tmuxinator project or one of its windows, <prefix>-A a Claude Code
# session grouped by the tmux session that shows it.
bind-key P display-popup -w 80% -h 60% -E "~/.config/scripts/tmux-tmuxinator-pick.sh"
bind-key A display-popup -w 80% -h 60% -E "~/.config/scripts/tmux-claude-agents.sh"
# <prefix>-o opens the ccmux agent picker (replaces the default select-pane -t :.+)
bind-key o display-popup -w 80% -h 75% -E "ccmux"

# Toggle between this session and its "<name>-ai" companion, creating it on demand
bind-key a run-shell "~/.config/scripts/tmux-ai-session.sh"

# Toggle logging this pane's output to /tmp/tmux-pipe/<timestamp>_<dir>.log with <prefix>-|.
# tmux expands the strftime and #{} parts itself (a shell $(date) or ${PWD##*/} would not
# survive: "##" is an escaped "#" here and the job does not run in the pane's directory).
bind-key | pipe-pane -o "mkdir -p /tmp/tmux-pipe; cat >> /tmp/tmux-pipe/%Y%m%dT%H%M%S_#{b:pane_current_path}.log" \; refresh-client -S
# ... and <prefix>-\ lists every pane with an open pipe.
bind-key '\' list-panes -a -f '#{pane_pipe}' -F '#{pane_id} #S:#I.#P #{pane_current_command} #{pane_current_path}'

# Reload tmux config with <prefix>-r.
bind-key r source-file ~/.config/tmux/tmux.conf \; display '~/.config/tmux/tmux.conf sourced'

# Theme (current-theme.conf is a link retargeted by ~/.config/scripts/switch-theme.sh)
source-file -q ~/.config/tmux/themes/current-theme.conf

# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'schasse/tmux-jump'
set -g @jump-key 'J'
# set -g @plugin 'omerxx/tmux-sessionx'
# set -g @sessionx-bind 'o'
run '~/.tmux/plugins/tpm/tpm'
